<!doctype html>
<html lang="pt-br">
  <head>
    <!-- CONFIGURAÇÕES BÁSICAS -->
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Movimenta+ | Login</title>

    <!-- CSS PRINCIPAL -->
    <link rel="stylesheet" href="style.css" />

    <!-- ÍCONE DA ABA -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💜</text></svg>"
    />
  </head>

  <body class="login-body">

    <div class="login-container">

      <!-- ILUSTRAÇÃO / APRESENTAÇÃO -->
      <section class="login-ilustracao">

        <h1>Movimenta+</h1>

        <p>
          Exercícios ao ar livre para saúde,
          bem-estar e evolução no seu ritmo.
        </p>

        <div class="icone-praca">
          🌳🚶‍♀️☀️
        </div>

      </section>

      <!-- CARD DE LOGIN -->
      <main class="login-card">

        <h2>Entrar</h2>

        <p class="login-subtitulo">
          Acesse sua conta para continuar
        </p>

        <!-- CAMPO E-MAIL -->
        <label for="emailLogin">
          E-mail
        </label>

        <input
          type="email"
          id="emailLogin"
          placeholder="Digite seu e-mail"
          autocomplete="email"
        />

        <!-- CAMPO SENHA -->
        <label for="senhaLogin">
          Senha
        </label>

        <input
          type="password"
          id="senhaLogin"
          placeholder="Digite sua senha"
          autocomplete="current-password"
        />

        <!-- RECUPERAR SENHA -->
        <p class="login-link">

          <a
            href="#"
            onclick="recuperarSenha()"
          >
            Esqueci minha senha
          </a>

        </p>

        <!-- BOTÃO LOGIN -->
        <button
          type="button"
          onclick="fazerLogin()"
        >
          Entrar
        </button>

        <!-- LINK CADASTRO -->
        <p class="login-link">

          Ainda não tem conta?

          <a href="cadastro.html">
            Criar cadastro
          </a>

        </p>

      </main>

    </div>

    <!-- MODAL RECUPERAR SENHA -->
    <div
      id="recuperarCard"
      class="recuperar-card"
    >

      <h2>Recuperar senha</h2>

      <p class="login-subtitulo">
        Digite seu e-mail e crie uma nova senha
      </p>

      <!-- E-MAIL RECUPERAÇÃO -->
      <label for="emailRecuperar">
        E-mail
      </label>

      <input
        type="email"
        id="emailRecuperar"
        placeholder="Digite seu e-mail cadastrado"
      />

      <!-- NOVA SENHA -->
      <label for="novaSenhaRecuperar">
        Nova senha
      </label>

      <input
        type="password"
        id="novaSenhaRecuperar"
        placeholder="Digite a nova senha"
      />

      <!-- BOTÃO ALTERAR SENHA -->
      <button
        type="button"
        onclick="alterarSenhaRecuperacao()"
      >
        Alterar senha
      </button>

      <!-- BOTÃO CANCELAR -->
      <button
        type="button"
        class="btn-secundario"
        onclick="fecharRecuperacao()"
      >
        Cancelar
      </button>

    </div>

    <!-- SCRIPT DE AUTENTICAÇÃO -->
    <script src="auth.js"></script>

  </body>
</html>
